<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9400D3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <path d="M20,80 Q40,20 60,50" fill="none" stroke="url(#grad1)" stroke-width="15" stroke-linecap="round" />
  <path d="M60,50 Q80,80 80,20" fill="none" stroke="url(#grad2)" stroke-width="15" stroke-linecap="round" />
  <circle cx="80" cy="20" r="5" fill="#FFF">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="20" cy="80" r="3" fill="#FFF">
    <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
